name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep the existing ubuntu-latest check names and test Ubuntu 26 ahead of its rollout.
        os: [ubuntu-latest, ubuntu-26.04, windows-latest]
        node: [22, 24, 26]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - name: Install Pi 1.0.4 for compatibility checks
        shell: bash
        run: |
          archive="$(npm pack --silent @earendil-works/pi-coding-agent@1.0.4)"
          test -f "$archive"
          rm -rf node_modules/@earendil-works/pi-coding-agent
          mkdir -p node_modules/@earendil-works/pi-coding-agent
          tar -xzf "$archive" --strip-components=1 -C node_modules/@earendil-works/pi-coding-agent
          rm "$archive"
      - name: Check against Pi 1.0.4
        run: npm run check
      - name: Test against Pi 1.0.4
        run: npm test
      - run: npm pack --dry-run --ignore-scripts
