name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install Pi 1.1.0 for compatibility checks
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@1.1.0
      - name: Check against Pi 1.1.0
        run: npm run check
      - name: Test against Pi 1.1.0
        run: npm test
      - run: npm pack --dry-run --ignore-scripts
