name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep existing Ubuntu check names, test Ubuntu 26 ahead of rollout, and exercise POSIX on macOS.
        os: [ubuntu-latest, ubuntu-26.04, macos-latest, windows-latest]
        node: [22, 24, 26]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'
        shell: bash
        run: |
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'label "ubuntu-26\.04" is unknown\.' \
            .github/workflows/*.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - name: Install Pi 1.0.4 for compatibility checks
        shell: bash
        run: |
          archive="$(npm pack --silent @earendil-works/pi-coding-agent@1.0.4)"
          test -f "$archive"
          rm -rf node_modules/@earendil-works/pi-coding-agent
          mkdir -p node_modules/@earendil-works/pi-coding-agent
          tar -xzf "$archive" --strip-components=1 -C node_modules/@earendil-works/pi-coding-agent
          rm "$archive"
      - name: Check against Pi 1.0.4
        run: npm run check
      - name: Test against Pi 1.0.4
        run: npm test
      - run: npm pack --dry-run --ignore-scripts
