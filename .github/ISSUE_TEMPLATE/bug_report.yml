name: Bug report
description: Report a problem you can reproduce with pi-subagents.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** don't include credentials, tokens, private prompts, session data, project files, raw logs, or screenshots that show them. Use synthetic or redacted examples. To report a vulnerability, use the [private form](https://github.com/leocavalcante/pi-subagents/security/advisories/new) instead.
  - type: input
    id: extension-version
    attributes:
      label: pi-subagents version
      description: Shown by `pi list`. Enter `unknown` if unavailable.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`.
      placeholder: 1.5.2
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v22.19.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: How you installed pi-subagents
      options:
        - Pi extension from npm
        - Pi extension from GitHub
        - Pi extension from a local checkout
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic prompts and agent definitions. Do not include private project paths or task content.
      placeholder: |
        1. Create a local test agent.
        2. Run a subagent tool call.
        3. Describe the sanitized result.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened instead, without private content.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Share only sanitized details. Don't attach raw logs, prompts, or session data.
